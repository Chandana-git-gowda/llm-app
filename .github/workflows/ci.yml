name: CI Pipeline

#when to run and where 
on:
  push:
    branches: [ "main" ]
    
#what to do; name, and runs on
jobs:
  test:
    runs-on: ubuntu-latest
    #instal files
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

      - name: Deploy (Simulated)
        run: echo "All tests passed! Deploying LLM app..."
